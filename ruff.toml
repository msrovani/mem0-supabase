[tool.ruff]
target-version = "py39"
line-length = 120
src = ["mem0", "server", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (common in FastAPI)
    "N818",  # exception name should end with Error
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN"]
"mem0/__init__.py" = ["F401", "E402"]
"server/main.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["mem0"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
